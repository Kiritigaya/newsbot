name: News bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Guard - only one set of bots at a time
        id: guard
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          count=$(curl -sS -H "Authorization: token $GH_PAT" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Kiritigaya/newsbot/actions/workflows/news.yml/runs?status=in_progress" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['total_count'])")
          echo "in_progress runs (including me): $count"
          proceed=false
          for i in $(seq 1 12); do
            others=$((count - 1))
            if [ "$others" -le 0 ]; then
              proceed=true
              break
            fi
            echo "Another run is active, waiting ($i/12)..."
            sleep 10
            count=$(curl -sS -H "Authorization: token $GH_PAT" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Kiritigaya/newsbot/actions/workflows/news.yml/runs?status=in_progress" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['total_count'])")
          done
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"
          if [ "$proceed" = "false" ]; then
            echo "Another bot run is already active - skipping this one."
          fi

      - name: Install
        if: steps.guard.outputs.proceed == 'true'
        run: pip install -r requirements.txt

      - name: Run bots
        if: steps.guard.outputs.proceed == 'true'
        timeout-minutes: 350
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          REMINDER_BOT_TOKEN: ${{ secrets.REMINDER_BOT_TOKEN }}
          DEALS_BOT_TOKEN: ${{ secrets.DEALS_BOT_TOKEN }}
          TRANSLATE_EMAIL: ${{ secrets.TRANSLATE_EMAIL }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TZ_OFFSET: '7'
        run: |
          mkdir -p state reminder_data deals_data
          (while true; do python bot.py; echo "news bot exited, restarting"; sleep 5; done) &
          (while true; do python reminder_bot.py; echo "reminder bot exited, restarting"; sleep 5; done) &
          (while true; do python deals_bot.py; echo "deals bot exited, restarting"; sleep 5; done) &
          wait

      - name: Save state
        if: always() && steps.guard.outputs.proceed == 'true'
        run: |
          git config user.name "newsbot"
          git config user.email "newsbot@users.noreply.github.com"
          git add -A state reminder_data deals_data
          if ! git diff --cached --quiet; then
            git commit -m "Update bot state"
            git push
          fi

      - name: Chain next run
        if: always() && steps.guard.outputs.proceed == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          sleep 10
          count=$(curl -sS -H "Authorization: token $GH_PAT" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Kiritigaya/newsbot/actions/workflows/news.yml/runs?status=in_progress" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['total_count'])")
          echo "in_progress runs: $count"
          if [ "$count" -le 1 ]; then
            curl -sS -X POST -H "Authorization: token $GH_PAT" \
              -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
              -d '{"ref":"main"}' \
              "https://api.github.com/repos/Kiritigaya/newsbot/actions/workflows/news.yml/dispatches"
            echo "next run dispatched"
          fi
